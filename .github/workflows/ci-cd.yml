name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/qr_system

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Production audit
        run: npm audit --omit=dev

  build_image:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image tags
        id: meta
        run: |
          IMAGE="${IMAGE_NAME}"
          echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  deploy_aws:
    runs-on: ubuntu-latest
    needs: build_image
    if: github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      AWS_HOST: ${{ secrets.AWS_HOST }}
      AWS_USER: ${{ secrets.AWS_USER }}
      AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        run: |
          missing=0
          for name in AWS_HOST AWS_USER AWS_SSH_PRIVATE_KEY DEPLOY_PATH POSTGRES_PASSWORD SESSION_SECRET APP_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Deploy target: $AWS_USER@$AWS_HOST"

      - name: Copy compose file
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" "sudo mkdir -p '$DEPLOY_PATH' && sudo chown '$AWS_USER:$AWS_USER' '$DEPLOY_PATH'"
          scp $SSH_OPTS docker-compose.prod.yml "$AWS_USER@$AWS_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Prepare server Docker
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" << 'EOF'
          set -e
          if ! command -v docker >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl git
              curl -fsSL https://get.docker.com | sudo sh
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y docker git
              sudo systemctl enable --now docker
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y docker git
              sudo systemctl enable --now docker
            else
              echo "No supported package manager found to install Docker" >&2
              exit 1
            fi
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is unavailable" >&2
            exit 1
          fi
          EOF

      - name: Deploy
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
          ssh $SSH_OPTS "$AWS_USER@$AWS_HOST" << EOF
          set -e
          cd "$DEPLOY_PATH"
          cat > .env << ENVEOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=postgresql://postgres:$POSTGRES_PASSWORD@postgres:5432/gatecontrol
          SESSION_SECRET=$SESSION_SECRET
          APP_URL=$APP_URL
          APP_IMAGE=${{ needs.build_image.outputs.image }}
          ENVEOF
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull app
          docker compose up -d
          docker compose ps
          EOF
